name: Build XNU Kernel for Santoni

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Prepare Xcode SDK Environment
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
        SDK_PATH=$(xcrun --show-sdk-path --sdk macosx)
        echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
        echo "Current SDKROOT is: $SDK_PATH"
        
        sudo mkdir -p "$SDK_PATH/usr/local/libexec"
        echo '#!/usr/bin/env perl' | sudo tee "$SDK_PATH/usr/local/libexec/availability.pl" > /dev/null
        echo 'exit 0;' | sudo tee -a "$SDK_PATH/usr/local/libexec/availability.pl" > /dev/null
        sudo chmod +x "$SDK_PATH/usr/local/libexec/availability.pl"

    - name: 3. Download XNU Source
      run: |
        echo "Downloading Apple XNU 8796.121.2..."
        curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
        tar -xzf xnu.tar.gz
        mv xnu-xnu-8796.121.2 xnu-src

        echo "Attempting to download ios-topaz base repo..."
        if curl -f -s -L -o topaz.tar.gz https://github.com/console-ramoops/ios-topaz/archive/refs/heads/main.tar.gz; then
          tar -xzf topaz.tar.gz
          cp -rn ios-topaz-main/* xnu-src/ || true
        fi
        
        cd xnu-src
        git init .
        git add .
        git commit -m "Base Source" -q

    - name: 4. Apply Project Patches (Fault Tolerant)
      run: |
        cd xnu-src
        for patch in ../xnu/patches/*.patch; do
          echo "=================================================="
          echo "Applying: $patch"
          patch -p1 -N -t --reject-file=- < "$patch" || true
        done
        echo "Finished applying patches."

    - name: 5. Fix Missing Paths & Bruteforce Source Fixes
      run: |
        cd xnu-src
        
        mkdir -p BUILD/obj/EXPORT_HDRS/libsa
        
        SDK_INCLUDE="$SDKROOT/usr/local/include/kernel"
        sudo mkdir -p "$SDK_INCLUDE"
        sudo ln -sf "$PWD/bsd" "$SDK_INCLUDE/bsd" 2>/dev/null || true
        sudo ln -sf "$PWD/osfmk" "$SDK_INCLUDE/osfmk" 2>/dev/null || true
        sudo ln -sf "$PWD/iokit" "$SDK_INCLUDE/iokit" 2>/dev/null || true
        
        FW_PLATFORM="$SDKROOT/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
        sudo mkdir -p "$FW_PLATFORM"
        sudo cp -a "$PWD/pexpert/platform"* "$FW_PLATFORM/" 2>/dev/null || true
        sudo cp -a "$PWD/osfmk/arm64"* "$FW_PLATFORM/" 2>/dev/null || true

        echo "=== 1. 修复 SweetFramebuffer.cpp 缺头文件 ==="
        FB_FILE="iokit/Kernel/arm/SweetFramebuffer.cpp"
        SURFACE_H=$(find . -name "SweetSurface.h" | head -n 1)
        if [ -f "$FB_FILE" ]; then
            if [ -n "$SURFACE_H" ]; then
                REL_PATH=$(echo "$SURFACE_H" | sed 's|^\./||')
                echo "Found SweetSurface.h at $REL_PATH, injecting include..."
                sed -i '' "1i\\
#include \\\"$REL_PATH\\\"
" "$FB_FILE"
            else
                echo "SweetSurface.h not found, using forward declaration hack..."
                sed -i '' '1i\
#include <stddef.h>\
#include <libkern/OSAtomic.h>\
class SweetSurface { public: void* state; void release(); }; 
' "$FB_FILE"
            fi
        fi

        echo "=== 2. 用宏定义完美替换 subr_log.c 里的 firehose 依赖 ==="
        sudo mkdir -p "$SDK_INCLUDE/os"
        FH_FILE="$SDK_INCLUDE/os/firehose_buffer_private.h"
        
        echo '#ifndef _OS_FIREHOSE_BUFFER_PRIVATE_H_' | sudo tee "$FH_FILE" > /dev/null
        echo '#define _OS_FIREHOSE_BUFFER_PRIVATE_H_' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#include <stdbool.h>' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#include <stddef.h>' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#define FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT 1024' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#define FIREHOSE_BUFFER_KERNEL_DEFAULT_IO_PAGES 16' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#define __firehose_merge_updates(a) false' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#define __firehose_kernel_configuration_valid(a, b) true' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#define __firehose_buffer_create(a) 0' | sudo tee -a "$FH_FILE" > /dev/null
        echo '#endif' | sudo tee -a "$FH_FILE" > /dev/null

        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export MACHINE_CONFIGS=T6000
        export TARGET=arm64-apple-ios16.0
        
        echo "Generating XNU export headers..."
        make exporthdrs ARCH_CONFIGS=$ARCH_CONFIGS KERNEL_CONFIGS=$KERNEL_CONFIGS MACHINE_CONFIGS=$MACHINE_CONFIGS TARGET=$TARGET || true

    - name: 6. Build XNU Kernel
      run: |
        cd xnu-src
        
        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export MACHINE_CONFIGS=T6000
        export TARGET=arm64-apple-ios16.0
        
        echo "Removing -Werror from all Makefiles..."
        find . -type f \( -name "Makefile*" -o -name "MakeInc*" \) -exec sed -i '' 's/-Werror//g' {} + || true
        
        export CFLAGS="-w -Wno-error"
        export CXXFLAGS="-w -Wno-error"
        export LINKER=ld
        export LD=/usr/bin/ld
        export LDFLAGS="-Wl,-no_deduplicate"
        
        echo "Starting main compilation..."
        make ARCH_CONFIGS=$ARCH_CONFIGS \
             KERNEL_CONFIGS=$KERNEL_CONFIGS \
             MACHINE_CONFIGS=$MACHINE_CONFIGS \
             TARGET=$TARGET \
             WERROR= \
             CFLAGS_DEVELOPMENTARM64="-w -Wno-error" \
             CXXFLAGS_DEVELOPMENTARM64="-w -Wno-error" \
             LINKER=$LINKER \
             LDFLAGS="$LDFLAGS" \
             -j$(sysctl -n hw.ncpu)

    - name: 7. Upload Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-XNU-Kernel
        path: |
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/kernel.development*
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/mach.development*
        if-no-files-found: warn
