name: Build XNU Kernel for Santoni

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Select Xcode Version & Fix SDK Path
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
        # 获取当前 Xcode 对应的 macOS SDK 路径并写入环境变量
        SDK_PATH=$(xcrun --show-sdk-path --sdk macosx)
        echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
        echo "Current SDKROOT is: $SDK_PATH"
        
        # 修复 Xcode 16 移除了 availability.pl 导致的编译错误
        # 往 SDK 路径伪造一个空的 availability.pl
        sudo mkdir -p "$SDK_PATH/usr/local/libexec"
        echo '#!/usr/bin/env perl' | sudo tee "$SDK_PATH/usr/local/libexec/availability.pl" > /dev/null
        echo 'exit 0;' | sudo tee -a "$SDK_PATH/usr/local/libexec/availability.pl" > /dev/null
        sudo chmod +x "$SDK_PATH/usr/local/libexec/availability.pl"

    - name: 3. Download XNU Source
      run: |
        echo "Downloading Apple XNU 8796.121.2..."
        curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
        tar -xzf xnu.tar.gz
        mv xnu-xnu-8796.121.2 xnu-src

        # 尝试下载基础 repo，不存在则跳过
        echo "Attempting to download ios-topaz base repo..."
        if curl -f -s -L -o topaz.tar.gz https://github.com/console-ramoops/ios-topaz/archive/refs/heads/main.tar.gz; then
          tar -xzf topaz.tar.gz
          cp -rn ios-topaz-main/* xnu-src/ || true
        else
          echo "Warning: Could not download ios-topaz. Proceeding."
        fi
        
        cd xnu-src
        git init .
        git add .
        git commit -m "Base Source" -q

    - name: 4. Apply Project Patches (Fault Tolerant)
      run: |
        cd xnu-src
        for patch in ../xnu/patches/*.patch; do
          echo "=================================================="
          echo "Applying: $patch"
          # 容错打补丁，失败也继续
          patch -p1 -N -t --reject-file=- < "$patch" || true
        done
        echo "Finished applying patches."

    - name: 5. Build XNU Kernel
      run: |
        cd xnu-src
        
        # --- 修复: 预创建缺失的目录并链接必要头文件 ---
        echo "Fixing missing include directories..."
        
        # 1. 确保 EXPORT_HDRS 目录存在
        mkdir -p BUILD/obj/EXPORT_HDRS/libsa
        
        # 2. 在 SDK 中创建缺失的 usr/local/include/kernel 并链接内核头文件
        SDK_INCLUDE="$SDKROOT/usr/local/include/kernel"
        sudo mkdir -p "$SDK_INCLUDE"
        # 将源码树中的关键头文件链接过去 (根据实际需要可增加)
        sudo ln -sf "$PWD/bsd" "$SDK_INCLUDE/bsd" 2>/dev/null || true
        sudo ln -sf "$PWD/osfmk" "$SDK_INCLUDE/osfmk" 2>/dev/null || true
        sudo ln -sf "$PWD/iokit" "$SDK_INCLUDE/iokit" 2>/dev/null || true
        
        # 3. 在 SDK 中创建缺失的 Kernel.framework PrivateHeaders/platform 目录
        FW_PLATFORM="$SDKROOT/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
        sudo mkdir -p "$FW_PLATFORM"
        # 将源码树中的 platform 头文件复制过去
        sudo cp -a "$PWD/pexpert/platform"* "$FW_PLATFORM/" 2>/dev/null || true
        
        # 4. 生成 XNU 的导出头文件 (重要! 这是缺失目录的根源)
        echo "Generating XNU export headers..."
        make exporthdrs ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=T6000 TARGET=arm64-apple-ios16.0
        
        # --- 修复结束 ---
        
        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export MACHINE_CONFIGS=T6000
        export TARGET=arm64-apple-ios16.0
        
        echo "Starting main compilation..."
        make ARCH_CONFIGS=$ARCH_CONFIGS \
             KERNEL_CONFIGS=$KERNEL_CONFIGS \
             MACHINE_CONFIGS=$MACHINE_CONFIGS \
             TARGET=$TARGET \
             -j$(sysctl -n hw.ncpu)

    - name: 6. Upload Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-XNU-Kernel
        path: |
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/kernel.development*
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/mach.development*
        if-no-files-found: warn
