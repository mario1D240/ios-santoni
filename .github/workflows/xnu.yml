name: Build XNU Kernel for Santoni

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: 3. Download XNU Source
      run: |
        echo "Downloading Apple XNU 8796.121.2..."
        curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
        tar -xzf xnu.tar.gz
        mv xnu-xnu-8796.121.2 xnu-src

        # 尝试下载基础 repo，如果 404 失败则自动跳过
        echo "Attempting to download ios-topaz base repo..."
        if curl -f -s -L -o topaz.tar.gz https://github.com/console-ramoops/ios-topaz/archive/refs/heads/main.tar.gz; then
          echo "Topaz downloaded, extracting..."
          tar -xzf topaz.tar.gz
          cp -rn ios-topaz-main/* xnu-src/ || true
        else
          echo "Warning: Could not download ios-topaz. Proceeding without it."
        fi
        
        cd xnu-src
        git init .
        git add .
        git commit -m "Base Source" -q
        echo "Source tree ready."

    - name: 4. Apply Project Patches (Fault Tolerant)
      run: |
        cd xnu-src
        for patch in ../xnu/patches/*.patch; do
          echo "=================================================="
          echo "Applying: $patch"
          # -t: 批处理，不询问。 --reject-file=-: 将失败内容打印到控制台。
          # || true: 如果某个补丁失败，忽略错误继续打下一个。
          patch -p1 -N -t --reject-file=- < "$patch" || true
        done
        echo "Finished applying patches."

    - name: 5. Build XNU Kernel
      run: |
        cd xnu-src
        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export TARGET=arm64-apple-ios16.0
        
        # 关键修正：加入 MACHINE_CONFIG=ARM64，避免默认使用 VMAPPLE
        make ARCH_CONFIGS=$ARCH_CONFIGS \
             KERNEL_CONFIGS=$KERNEL_CONFIGS \
             MACHINE_CONFIG=ARM64 \
             TARGET=$TARGET \
             -j$(sysctl -n hw.ncpu)
             
    - name: 6. Upload Kernel Artifact
      if: always() # 就算编译报错，只要生成了文件就尝试上传
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-XNU-Kernel
        path: |
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/kernel.development*
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/mach.development*
        if-no-files-found: warn
