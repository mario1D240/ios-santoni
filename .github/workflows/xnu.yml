jobs:
  build:
    # 将 macos-14 改为 macos-15
    runs-on: macos-15
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        # 根据日志确认 Xcode 路径，通常 macos-15 预装 Xcode 16.x
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
        xcodebuild -version

    - name: Download XNU source
      run: |
        git clone --depth 1 -b xnu-8796.121.2 \
          https://github.com/apple-oss-distributions/xnu.git xnu-src
    # ... 其余步骤保持不变
