name: Build XNU Kernel for Santoni

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Select Xcode Version
      run: |
        echo "Available Xcode versions:"
        ls /Applications | grep Xcode
        # 如果你发现 Xcode_16.4.app 不存在，请根据上面列出的名称修改这里
        sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
        xcodebuild -version

    - name: 3. Download XNU Source (Tarball Method)
      run: |
        echo "Downloading XNU 8796.121.2 tarball..."
        curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
        echo "Extracting..."
        tar -xzf xnu.tar.gz
        # 解压后的文件夹名通常叫 xnu-xnu-8796.121.2，我们把它重命名为 xnu-src
        mv xnu-xnu-8796.121.2 xnu-src
        echo "Source tree ready."
        ls xnu-src/ | head -n 5

    - name: 4. Apply Project Patches
      run: |
        cd xnu-src
        # 初始化一个临时的 git 仓库，方便 git apply 完美处理路径
        git init .
        git add .
        git commit -m "Base XNU Source" -q
        
        for patch in ../xnu/patches/*.patch; do
          echo "=================================================="
          echo "Applying: $patch"
          # 使用 git apply 替代 patch，更智能地处理路径
          git apply --whitespace=nowarn "$patch" || { echo "Patch failed: $patch"; exit 1; }
        done
        echo "All patches applied successfully!"
    - name: 5. Build XNU Kernel
      run: |
        cd xnu-src
        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export TARGET=arm64-apple-ios16.0
        make ARCH_CONFIGS=$ARCH_CONFIGS KERNEL_CONFIGS=$KERNEL_CONFIGS TARGET=$TARGET -j$(sysctl -n hw.ncpu)

    - name: 6. Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-XNU-Kernel
        path: |
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/kernel.development*
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/mach.development*
        if-no-files-found: warn
