name: Build XNU Kernel for Santoni

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Select Xcode Version
      run: |
        echo "Available Xcode versions:"
        ls /Applications | grep Xcode
        # 默认使用最新安装的 Xcode，如果报错可指定具体版本如 Xcode_16.0.app
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: 3. Download XNU Source & Base Repo
      run: |
        echo "Downloading Apple XNU 8796.121.2..."
        curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-8796.121.2.tar.gz
        tar -xzf xnu.tar.gz
        mv xnu-xnu-8796.121.2 xnu-src

        # 【关键】ios-santoni 的补丁依赖 ios-topaz 的基础文件（比如 sweet_hfs）
        # 我们尝试拉取基础仓库并合并，确保缺失的目录被补齐
        echo "Downloading base ios-topaz repo for missing files..."
        curl -L -o topaz.tar.gz https://github.com/console-ramoops/ios-topaz/archive/refs/heads/main.tar.gz || true
        if [ -f topaz.tar.gz ]; then
          tar -xzf topaz.tar.gz
          # 将 topaz 的文件复制进 xnu-src，不覆盖已有文件
          cp -rn ios-topaz-main/* xnu-src/ || true
        fi
        
        cd xnu-src
        git init .
        git add .
        git commit -m "Base Source" -q
        echo "Source tree ready."

    - name: 4. Apply Project Patches (Fault Tolerant)
      run: |
        cd xnu-src
        for patch in ../xnu/patches/*.patch; do
          echo "=================================================="
          echo "Applying: $patch"
          
          # 使用 patch 命令，参数说明：
          # -p1: 剥离第一层目录 (a/ 或 b/)
          # -N: 忽略已经打过的补丁
          # -t: 批处理模式，遇到错误不询问，直接跳过
          # --reject-file=-: 将失败的 hunks 输出到终端（方便排查），不在本地留 .rej 文件
          # || true: 确保即使这个补丁部分失败，也继续打下一个补丁
          patch -p1 -N -t --reject-file=- < "$patch" || true
        done
        echo "Finished applying patches."

    - name: 5. Build XNU Kernel
      run: |
        cd xnu-src
        export ARCH_CONFIGS=ARM64
        export KERNEL_CONFIGS=DEVELOPMENT
        export TARGET=arm64-apple-ios16.0
        
        # 开始编译
        make ARCH_CONFIGS=$ARCH_CONFIGS KERNEL_CONFIGS=$KERNEL_CONFIGS TARGET=$TARGET -j$(sysctl -n hw.ncpu)

    - name: 6. Upload Kernel Artifact
      if: always() # 即使编译失败，也尝试上传生成的文件或日志
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-XNU-Kernel
        path: |
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/kernel.development*
          xnu-src/BUILD/obj/DEVELOPMENT_ARM64/mach.development*
        if-no-files-found: warn
